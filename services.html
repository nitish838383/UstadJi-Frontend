<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all home services on UstadJi - Electrician, Plumber, Cleaning and more">
  <title>Services – UstadJi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-1">
    <!-- Header -->
    <div class="bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-3xl font-bold text-slate-900 dark:text-white">All Services</h1>
        <p class="text-slate-500 mt-1">Choose from our wide range of home services</p>
      </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

      <!-- Category chips (optional visual) -->
      <div id="services-categories" class="flex flex-wrap gap-2 mb-6"></div>

      <!-- Filters -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-5 border border-slate-100 dark:border-slate-700 mb-6 shadow-sm">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">

          <!-- Search -->
          <div class="lg:col-span-2">
            <label class="text-xs font-medium text-slate-500 mb-1 block">Search</label>
            <div class="relative">
              <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="text" id="service-search" placeholder="Search services…"
                     class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 outline-none">
            </div>
          </div>

          <!-- Category -->
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">Category</label>
            <select id="filter-category"
                    class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 outline-none">
              <option value="">All Categories</option>
            </select>
          </div>

          <!-- Sort -->
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">Sort by</label>
            <select id="filter-sort"
                    class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 outline-none">
              <option value="">Default</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
              <option value="rating">Highest Rated</option>
              <option value="popular">Most Popular</option>
            </select>
          </div>

          <!-- Rating -->
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">Min Rating</label>
            <select id="filter-rating"
                    class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 outline-none">
              <option value="">Any</option>
              <option value="4">4+ Stars</option>
              <option value="3">3+ Stars</option>
              <option value="2">2+ Stars</option>
            </select>
          </div>

          <!-- Price Min -->
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">Min Price</label>
            <input type="number" id="filter-price-min" placeholder="₹0"
                   class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 outline-none">
          </div>

          <!-- Price Max -->
          <div>
            <label class="text-xs font-medium text-slate-500 mb-1 block">Max Price</label>
            <input type="number" id="filter-price-max" placeholder="₹5000"
                   class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary-500 outline-none">
          </div>

          <!-- Popular -->
          <div class="flex items-end">
            <label class="flex items-center gap-2 cursor-pointer select-none py-2.5">
              <input type="checkbox" id="filter-popular" class="rounded text-primary-600 focus:ring-primary-500">
              <span class="text-sm text-slate-700 dark:text-slate-300">Popular only</span>
            </label>
          </div>
        </div>

        <div class="flex flex-wrap gap-3 mt-4">
          <button type="button" onclick="ServicesModule.applyFilters()"
                  class="px-5 py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-xl text-sm font-medium transition-colors">
            <i class="fas fa-filter mr-1.5"></i> Apply Filters
          </button>
          <button type="button" onclick="ServicesModule.clearFilters()"
                  class="px-5 py-2.5 border border-slate-200 dark:border-slate-600 rounded-xl text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
            Clear
          </button>
        </div>
      </div>

      <!-- Grid -->
      <div id="services-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>

      <!-- Pagination -->
      <div id="services-pagination"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/helper.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/services.js"></script>
  <script src="/js/notification.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Public page — no Auth.requireAuth()
      ServicesModule.initFilters();           // loads categories into select + applies URL filters
      ServicesModule.loadCategories('services-categories'); // chips row (optional)
    });
  </script>
</body>
</html>
