<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Login – UstadJi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col">
  <div id="site-header"></div>
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center mx-auto mb-4 shadow-lg">
          <i class="fas fa-user-hard-hat text-white text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Professional Login</h1>
        <p class="text-slate-500 mt-1">Access your worker dashboard</p>
      </div>
      <form id="worker-login-form" class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 p-6 sm:p-8 space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
          <input type="email" id="email" data-validate="required|email" placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
          <input type="password" id="password" data-validate="required" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="remember" checked class="rounded text-primary-600"> Remember me</label>
          <a href="/forgot-password.html" class="text-sm text-primary-600 hover:underline">Forgot?</a>
        </div>
        <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-semibold transition-colors">Login</button>
        <p class="text-center text-sm text-slate-500">New professional? <a href="/worker-register.html" class="text-emerald-600 font-medium hover:underline">Register</a></p>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/config.js"></script>
  <script src="/js/helper.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    Auth.redirectIfAuthenticated();
    document.getElementById('worker-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { valid } = Validation.validateForm(e.target);
      if (!valid) return;
      try {
        Helper.showLoader();
        await Auth.workerLogin(document.getElementById('email').value, document.getElementById('password').value, document.getElementById('remember').checked);
        Helper.toast('Welcome back!', 'success');
        window.location.href = '/dashboard-worker.html';
      } catch (err) {
        Helper.toast(err.message, 'error');
      } finally {
        Helper.hideLoader();
      }
    });
  </script>
</body>
</html>
