<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – UstadJi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col">
  <div id="site-header"></div>
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center mx-auto mb-4 shadow-lg shadow-primary-600/20">
          <i class="fas fa-user-plus text-white text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Create Account</h1>
        <p class="text-slate-500 mt-1">Join UstadJi and book services easily</p>
      </div>
      <form id="register-form" class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 p-6 sm:p-8 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Full Name</label>
          <input type="text" name="full_name" id="full_name" data-validate="required|minLength:2" placeholder="John Doe"
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
          <input type="email" name="email" id="email" data-validate="required|email" placeholder="you@example.com"
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Phone</label>
          <input type="tel" name="phone" id="phone" data-validate="required|phone" placeholder="9876543210"
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Password</label>
          <input type="password" name="password" id="password" data-validate="required|password" placeholder="Min 8 chars with upper, lower, number, special"
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Confirm Password</label>
          <input type="password" name="confirm_password" id="confirm_password" data-validate="required|match:password" placeholder="••••••••"
                 class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
        </div>
        <label class="flex items-start gap-2 text-sm text-slate-600 dark:text-slate-400">
          <input type="checkbox" id="terms" required class="mt-1 rounded border-slate-300 text-primary-600 focus:ring-primary-500">
          <span>I agree to the <a href="/terms.html" class="text-primary-600 hover:underline">Terms</a> and <a href="/privacy-policy.html" class="text-primary-600 hover:underline">Privacy Policy</a></span>
        </label>
        <button type="submit" class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-semibold transition-colors shadow-lg shadow-primary-600/20">
          Create Account
        </button>
        <p class="text-center text-sm text-slate-500">
          Already have an account? <a href="/login.html" class="text-primary-600 font-medium hover:underline">Login</a>
        </p>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/config.js"></script>
  <script src="/js/helper.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    Auth.redirectIfAuthenticated();
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { valid } = Validation.validateForm(e.target);
      if (!valid) return;
      const payload = {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        password: document.getElementById('password').value,
      };
      try {
        Helper.showLoader();
        await Auth.register(payload);
        Helper.toast('Account created successfully!', 'success');
        window.location.href = '/dashboard-user.html';
      } catch (err) {
        Helper.toast(err.message, 'error');
      } finally {
        Helper.hideLoader();
      }
    });
    Validation.attachLiveValidation(document.getElementById('register-form'));
  </script>
</body>
</html>
