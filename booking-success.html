<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed – UstadJi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col">
  <div id="site-header"></div>
  <main class="flex-1 flex items-center justify-center px-4 py-16">
    <div class="text-center max-w-md">
      <div class="w-20 h-20 rounded-full bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center mx-auto mb-6">
        <i class="fas fa-check text-3xl text-emerald-600"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Booking Confirmed!</h1>
      <p class="text-slate-500 mb-2">Your service has been booked successfully.</p>
      <p class="text-sm text-slate-400 mb-8">Booking ID: <span id="success-booking-id" class="font-semibold text-slate-700 dark:text-slate-200">—</span></p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <a href="/booking-history.html" class="px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-semibold transition-colors">View Bookings</a>
        <a href="/index.html" class="px-6 py-3 border border-slate-200 dark:border-slate-600 rounded-xl font-medium hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">Back to Home</a>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/config.js"></script>
  <script src="/js/helper.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const id = Helper.getQueryParam('id');
      if (id) document.getElementById('success-booking-id').textContent = '#' + id;
      const last = Helper.safeParse(sessionStorage.getItem('last_booking'));
      if (last) {
        document.getElementById('success-booking-id').textContent = '#' + (last.booking_id || last.id);
      }
    });
  </script>
</body>
</html>
