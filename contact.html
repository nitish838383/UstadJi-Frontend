<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us – UstadJi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col">
  <div id="site-header"></div>
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
    <div class="text-center mb-12">
      <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Contact Us</h1>
      <p class="text-slate-500 mt-2">We'd love to hear from you</p>
    </div>
    <div class="grid lg:grid-cols-2 gap-10">
      <form id="contact-form" class="bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-100 dark:border-slate-700 space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1.5">Name</label>
          <input name="name" data-validate="required" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Email</label>
          <input name="email" type="email" data-validate="required|email" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Subject</label>
          <input name="subject" data-validate="required" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1.5">Message</label>
          <textarea name="message" rows="4" data-validate="required" class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-primary-500 outline-none resize-none"></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-primary-600 hover:bg-primary-700 text-white rounded-xl font-semibold">Send Message</button>
      </form>
      <div class="space-y-6">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
          <h3 class="font-semibold text-slate-800 dark:text-white mb-4">Get in Touch</h3>
          <ul class="space-y-4 text-sm">
            <li class="flex items-center gap-3"><i class="fas fa-envelope text-primary-600 w-5"></i> support@ustadji.com</li>
            <li class="flex items-center gap-3"><i class="fas fa-phone text-primary-600 w-5"></i> +91 98765 43210</li>
            <li class="flex items-center gap-3"><i class="fas fa-map-marker-alt text-primary-600 w-5"></i> Mumbai, Maharashtra, India</li>
          </ul>
          <div class="flex gap-3 mt-6">
            <a href="#" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center hover:bg-primary-600 hover:text-white transition-colors"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center hover:bg-primary-600 hover:text-white transition-colors"><i class="fab fa-instagram"></i></a>
            <a href="#" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center hover:bg-primary-600 hover:text-white transition-colors"><i class="fab fa-twitter"></i></a>
          </div>
        </div>
        <div class="bg-slate-200 dark:bg-slate-800 rounded-2xl h-64 flex items-center justify-center text-slate-400">
          <div class="text-center"><i class="fas fa-map text-3xl mb-2"></i><p class="text-sm">Google Map Placeholder</p></div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/config.js"></script>
  <script src="/js/helper.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { valid } = Validation.validateForm(e.target);
      if (!valid) return;
      const data = Object.fromEntries(new FormData(e.target));
      try {
        Helper.showLoader();
        await API.contact.submit(data);
        Helper.toast('Message sent successfully!', 'success');
        e.target.reset();
      } catch (err) {
        Helper.toast(err.message, 'error');
      } finally {
        Helper.hideLoader();
      }
    });
  </script>
 <script>
    Auth.requireAuth();
</script>

</body>
</html>
